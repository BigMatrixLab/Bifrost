    <path d="M37.9,92.3A44,44 0 0 1 37.9,7.7" fill="none" stroke="#4ade80" stroke-width="9"/>
    <rect x="45.5" y="2" width="9" height="96" fill="#4ade80"/>
    <path d="M50,13 L61,24 L50,35 L39,24Z" fill="#121212" stroke="#4ade80" stroke-width="6"/>
    <path d="M50,65 L61,76 L50,87 L39,76Z" fill="#121212" stroke="#4ade80" stroke-width="6"/>
