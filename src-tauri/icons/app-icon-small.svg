       Explorer): the Bifrost mark simplified so it stays readable. Bolder
       ring, bar and diamonds, larger on the plate; the fine ticks, side bars
       and small diamonds are left out because they blur into the background
       below 48 px. Full detail is in app-icon.svg. -->
